<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ExamTech - Edit Profile</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logout {
            color: white;
            text-decoration: none;
            background: #1d4ed8;
            padding: 10px 20px;
            border-radius: 7px;
        }

        .logout:hover {
            background: #1e40af;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .role-box {
            background: #f1f5f9;
            padding: 12px;
            border-radius: 7px;
            color: #555;
        }

        .error {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
            padding: 12px;
            border-radius: 7px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        button,
        .cancel-button {
            padding: 12px 22px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel-button {
            background: #64748b;
            color: white;
        }

        .cancel-button:hover {
            background: #475569;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin: 25px auto;
            }

            .card {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }

            button,
            .cancel-button {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            ExamTech
        </div>

        <a href="/logout"
           class="logout">
            Logout
        </a>

    </div>


    <div class="container">

        <div class="card">

            <h1>Edit Profile</h1>

            <p class="subtitle">
                Update your account information.
            </p>


            <div th:if="${error}"
                 class="error"
                 th:text="${error}">
                Error message
            </div>


            <form action="/student/profile/edit"
                  method="post">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input type="text"
                           id="name"
                           name="name"
                           th:value="${user.name}"
                           placeholder="Enter your name"
                           required>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           th:value="${user.email}"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Role
                    </label>

                    <div class="role-box"
                         th:text="${user.role}">
                        STUDENT
                    </div>

                </div>


                <div class="buttons">

                    <button type="submit">
                        Save Changes
                    </button>

                    <a href="/student/profile"
                       class="cancel-button">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
