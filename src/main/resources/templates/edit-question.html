<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Question - ExamTech</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #2864e8;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .nav-buttons a {
            text-decoration: none;
            color: white;
            background: #1852d1;
            padding: 12px 20px;
            border-radius: 8px;
            margin-left: 10px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1e4699;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #1e4699;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd5e5;
            border-radius: 8px;
            font-size: 16px;
            background: white;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2864e8;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: #2864e8;
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-primary:hover {
            background: #1852d1;
        }

        .btn-secondary:hover {
            background: #555;
        }

        .note {
            background: #eef4ff;
            padding: 15px;
            border-left: 4px solid #2864e8;
            margin-bottom: 25px;
            border-radius: 6px;
            color: #333;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 15px 20px;
            }

            .logo {
                font-size: 24px;
            }

            .options-grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <div class="logo">ExamTech</div>

        <div class="nav-buttons">
            <a href="/examiner/questions">Question Bank</a>
            <a href="/examiner/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">

        <div class="card">

            <h1>Edit Question</h1>

            <p class="subtitle">
                Update the question details, type, marks, options, and correct answer.
            </p>

            <div class="note">
                Make the required changes and click <strong>Update Question</strong>
                to save the changes.
            </div>

            <form th:action="@{/examiner/questions/edit/{id}(id=${question.id})}"
                  th:object="${question}"
                  method="post">

                <!-- Question Text -->
                <div class="form-group">
                    <label for="questionText">Question</label>

                    <textarea id="questionText"
                              th:field="*{questionText}"
                              placeholder="Enter the question"
                              required></textarea>
                </div>

                <!-- Question Type -->
                <div class="form-group">
                    <label for="type">Question Type</label>

                    <select id="type"
                            th:field="*{type}"
                            onchange="toggleOptions()"
                            required>

                        <option value="MCQ">MCQ</option>
                        <option value="SHORT_ANSWER">Short Answer</option>
                        <option value="ESSAY">Essay</option>

                    </select>
                </div>

                <!-- Exam -->
                <div class="form-group">
                    <label for="exam">Exam</label>

                    <select id="exam"
                            name="exam.id"
                            required>

                        <option value="">Select Exam</option>

                        <option th:each="exam : ${exams}"
                                th:value="${exam.id}"
                                th:text="${exam.title}"
                                th:selected="${question.exam != null and question.exam.id == exam.id}">
                        </option>

                    </select>
                </div>

                <!-- Marks -->
                <div class="form-group">
                    <label for="marks">Marks</label>

                    <input type="number"
                           id="marks"
                           th:field="*{marks}"
                           min="1"
                           placeholder="Enter marks"
                           required>
                </div>

                <!-- MCQ Options -->
                <div id="mcqOptions">

                    <h3 style="color:#1e4699; margin-top:30px;">
                        MCQ Options
                    </h3>

                    <div class="options-grid">

                        <div class="form-group">
                            <label for="optionA">Option A</label>

                            <input type="text"
                                   id="optionA"
                                   th:field="*{optionA}"
                                   placeholder="Option A">
                        </div>

                        <div class="form-group">
                            <label for="optionB">Option B</label>

                            <input type="text"
                                   id="optionB"
                                   th:field="*{optionB}"
                                   placeholder="Option B">
                        </div>

                        <div class="form-group">
                            <label for="optionC">Option C</label>

                            <input type="text"
                                   id="optionC"
                                   th:field="*{optionC}"
                                   placeholder="Option C">
                        </div>

                        <div class="form-group">
                            <label for="optionD">Option D</label>

                            <input type="text"
                                   id="optionD"
                                   th:field="*{optionD}"
                                   placeholder="Option D">
                        </div>

                    </div>

                    <!-- Correct Answer -->
                    <div class="form-group">

                        <label for="correctAnswer">
                            Correct Answer
                        </label>

                        <select id="correctAnswer"
                                th:field="*{correctAnswer}">

                            <option value="">Select Correct Answer</option>

                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>

                        </select>

                    </div>

                </div>

                <!-- Buttons -->
                <div class="buttons">

                    <button type="submit"
                            class="btn btn-primary">
                        Update Question
                    </button>

                    <a href="/examiner/questions"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

    <script>

        function toggleOptions() {

            const type = document.getElementById("type").value;
            const mcqOptions = document.getElementById("mcqOptions");

            if (type === "MCQ") {
                mcqOptions.style.display = "block";
            } else {
                mcqOptions.style.display = "none";
            }
        }

        window.onload = function () {
            toggleOptions();
        };

    </script>

</body>

</html>
