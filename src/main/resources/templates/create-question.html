<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ExamTech - Create Question</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 28px;
        }

        .back-btn {
            background: #1d4ed8;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .mcq-section {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            padding: 20px;
            border-radius: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .mcq-section h3 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        .button-area {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            font-size: 15px;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #e5e7eb;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d1d5db;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 700px) {
            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin: 25px auto;
            }

            .card {
                padding: 25px;
            }

            .button-area {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="navbar">

    <h1>ExamTech</h1>

    <a href="/examiner/questions" class="back-btn">
        Back to Question Bank
    </a>

</div>

<div class="container">

    <div class="card">

        <h2>Create New Question</h2>

        <p class="subtitle">
            Add a question to the question bank and associate it with an examination.
        </p>

        <form action="/examiner/questions/create" method="post">

            <!-- Select Exam -->
            <div class="form-group">

                <label for="exam">
                    Examination
                </label>

                <select id="exam" name="exam.id" required>

                    <option value="">
                        Select an examination
                    </option>

                    <option
                        th:each="exam : ${exams}"
                        th:value="${exam.id}"
                        th:text="${exam.title}">
                    </option>

                </select>

            </div>

            <!-- Question Text -->
            <div class="form-group">

                <label for="questionText">
                    Question
                </label>

                <textarea
                    id="questionText"
                    name="questionText"
                    placeholder="Enter your question here..."
                    required></textarea>

            </div>

            <!-- Question Type -->
            <div class="form-group">

                <label for="type">
                    Question Type
                </label>

                <select
                    id="type"
                    name="type"
                    onchange="showQuestionFields()"
                    required>

                    <option value="">
                        Select question type
                    </option>

                    <option value="MCQ">
                        Multiple Choice Question (MCQ)
                    </option>

                    <option value="SHORT_ANSWER">
                        Short Answer
                    </option>

                    <option value="ESSAY">
                        Essay
                    </option>

                </select>

            </div>

            <!-- MCQ Options -->
            <div id="mcqFields" class="mcq-section hidden">

                <h3>MCQ Options</h3>

                <div class="form-group">

                    <label for="optionA">
                        Option A
                    </label>

                    <input
                        type="text"
                        id="optionA"
                        name="optionA"
                        placeholder="Enter option A">

                </div>

                <div class="form-group">

                    <label for="optionB">
                        Option B
                    </label>

                    <input
                        type="text"
                        id="optionB"
                        name="optionB"
                        placeholder="Enter option B">

                </div>

                <div class="form-group">

                    <label for="optionC">
                        Option C
                    </label>

                    <input
                        type="text"
                        id="optionC"
                        name="optionC"
                        placeholder="Enter option C">

                </div>

                <div class="form-group">

                    <label for="optionD">
                        Option D
                    </label>

                    <input
                        type="text"
                        id="optionD"
                        name="optionD"
                        placeholder="Enter option D">

                </div>

                <div class="form-group">

                    <label for="correctAnswer">
                        Correct Answer
                    </label>

                    <select
                        id="correctAnswer"
                        name="correctAnswer">

                        <option value="">
                            Select correct option
                        </option>

                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>

                    </select>

                </div>

            </div>

            <!-- Marks -->
            <div class="form-group">

                <label for="marks">
                    Marks
                </label>

                <input
                    type="number"
                    id="marks"
                    name="marks"
                    min="1"
                    placeholder="Enter marks"
                    required>

            </div>

            <!-- Buttons -->
            <div class="button-area">

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save Question
                </button>

                <a
                    href="/examiner/questions"
                    class="btn btn-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

<script>

function showQuestionFields() {

    const type = document.getElementById("type").value;

    const mcqFields = document.getElementById("mcqFields");

    if (type === "MCQ") {
        mcqFields.classList.remove("hidden");
    } else {
        mcqFields.classList.add("hidden");
    }
}

</script>

</body>
</html>
