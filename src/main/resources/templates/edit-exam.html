<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Exam - ExamTech</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        /* Navbar */

        .navbar {
            background: #2563eb;
            color: white;

            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* Container */

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Card */

        .form-card {
            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .form-card h1 {
            color: #1e3a8a;

            margin-bottom: 10px;
        }

        .form-card .subtitle {
            color: #666;

            margin-bottom: 30px;
        }

        /* Form */

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            color: #1e3a8a;

            font-weight: bold;

            margin-bottom: 8px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 7px;

            font-size: 15px;
        }

        .form-group textarea {
            min-height: 120px;

            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;

            border-color: #2563eb;
        }

        /* Checkbox */

        .active-group {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 25px;
        }

        .active-group input {
            width: 18px;
            height: 18px;

            cursor: pointer;
        }

        .active-group label {
            color: #333;

            font-weight: bold;

            cursor: pointer;
        }

        /* Buttons */

        .button-section {
            display: flex;

            gap: 15px;

            margin-top: 30px;
        }

        .update-button {
            background: #2563eb;

            color: white;

            border: none;

            padding: 13px 28px;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .update-button:hover {
            background: #1d4ed8;
        }

        .cancel-button {
            background: #64748b;

            color: white;

            text-decoration: none;

            padding: 13px 28px;

            border-radius: 7px;

            font-size: 16px;

            font-weight: bold;
        }

        .cancel-button:hover {
            background: #475569;
        }

        /* Mobile */

        @media (max-width: 700px) {

            .navbar {
                padding: 15px 20px;
            }

            .logo {
                font-size: 22px;
            }

            .form-card {
                padding: 25px 20px;
            }

            .button-section {
                flex-direction: column;
            }

            .update-button,
            .cancel-button {
                text-align: center;
                width: 100%;
            }
        }

    </style>

</head>


<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            ExamTech
        </div>

        <a href="/examiner/dashboard"
           class="back-link">
            Back to Dashboard
        </a>

    </div>


    <!-- MAIN CONTAINER -->

    <div class="container">

        <div class="form-card">

            <h1>
                Edit Examination
            </h1>

            <p class="subtitle">
                Update the examination details below.
            </p>


            <!-- EDIT EXAM FORM -->

            <form th:action="@{'/examiner/edit-exam/' + ${exam.id}}"
                  th:object="${exam}"
                  method="post">


                <!-- EXAM TITLE -->

                <div class="form-group">

                    <label for="title">
                        Exam Title
                    </label>

                    <input type="text"
                           id="title"
                           th:field="*{title}"
                           placeholder="Enter exam title"
                           required>

                </div>


                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea id="description"
                              th:field="*{description}"
                              placeholder="Enter exam description"
                              required></textarea>

                </div>


                <!-- DURATION -->

                <div class="form-group">

                    <label for="durationMinutes">
                        Duration (Minutes)
                    </label>

                    <input type="number"
                           id="durationMinutes"
                           th:field="*{durationMinutes}"
                           min="1"
                           placeholder="Enter duration in minutes"
                           required>

                </div>


                <!-- TOTAL MARKS -->

                <div class="form-group">

                    <label for="totalMarks">
                        Total Marks
                    </label>

                    <input type="number"
                           id="totalMarks"
                           th:field="*{totalMarks}"
                           min="1"
                           placeholder="Enter total marks"
                           required>

                </div>


                <!-- ACTIVE STATUS -->

                <div class="active-group">

                    <input type="checkbox"
                           id="active"
                           th:field="*{active}">

                    <label for="active">
                        Make this examination active
                    </label>

                </div>


                <!-- BUTTONS -->

                <div class="button-section">

                    <button type="submit"
                            class="update-button">
                        Update Exam
                    </button>

                    <a href="/examiner/dashboard"
                       class="cancel-button">
                        Cancel
                    </a>

                </div>


            </form>

        </div>

    </div>

</body>

</html>
